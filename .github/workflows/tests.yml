name: Oracle Kapasite Avcisi

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: PHP Kurulumu
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Gereksinimleri Yukle
      run: composer install --no-dev

    - name: Sifre Dosyasini Olustur
      env:
        SECRET_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      run: |
        echo "$SECRET_KEY" > private.pem
        chmod 600 private.pem

    - name: Botu Baslat
      env:
        OCI_REGION: ${{ secrets.OCI_REGION }}
        OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
        OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
        OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
        OCI_PRIVATE_KEY_FILENAME: private.pem
        OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
        OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
        OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
        OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
        OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
      run: php index.php
